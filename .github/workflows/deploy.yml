name: Deploy LLM RAG Event Discovery Pipeline

on:
  push:
    branches: [main]
    paths-ignore:
      # Skip deployment when only these files/folders change
      - 'terraform/**'           # Infrastructure changes don't need Docker rebuild
      - 'docs/**'                # Documentation changes
      - '*.md'                   # Root markdown files
      - '.github/**'             # Workflow changes (except this file triggers itself)
  workflow_dispatch:  # Allow manual trigger from GitHub UI

env:
  AWS_REGION: eu-west-1
  ECR_REPOSITORY: event-finder
  ECS_CLUSTER: london-events-cluster
  ECS_TASK_FAMILY: london-events-task

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}
    
    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2
    
    - name: Build, tag, and push image to Amazon ECR
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        # Build Docker image
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
        
        # Tag as latest
        docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
        
        # Push both tags
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
        
        echo "✅ Image pushed: $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
        echo "✅ Image pushed: $ECR_REGISTRY/$ECR_REPOSITORY:latest"
    
    - name: Output deployment info
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        echo "🎉 Deployment complete!"
        echo "📦 Image: $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
        echo "🔗 Commit: https://github.com/${{ github.repository }}/commit/${{ github.sha }}"
        echo ""
        echo "ℹ️  The ECS scheduled task will use this image on its next run"
